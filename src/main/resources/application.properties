# STDIO MCP server: stdout must carry ONLY JSON-RPC messages
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=train-booking-mcp
spring.ai.mcp.server.version=1.0.0

# no web server, no startup banner (logs go to stderr: see logback-spring.xml)
spring.main.web-application-type=none
spring.main.banner-mode=off
